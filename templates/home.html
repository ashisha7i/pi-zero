<!DOCTYPE html>
<html>
<head>
    <title>The Pi-peline</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
        }
        body {
            font-family: monospace;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 5px;
            box-sizing: border-box;
        }
        h2 {
            border-bottom: 2px solid #000;
            padding-bottom: 4px;
            font-size: 16px;
            margin: 5px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .heading-icon {
            font-size: 14px;
        }
        .input-group {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 4px 6px;
            font-size: 16px;
            border: 1px solid #000;
            border-radius: 0;
            outline: none;
        }
        button {
            padding: 4px 8px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid #000;
            border-radius: 0;
            background: #fff;
            color: #000;
        }
        .btn-add { background: #000; color: #fff; font-weight: bold; }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 8px 0;
            border-bottom: 1px dotted #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        a {
            color: #000;
            text-decoration: none;
            font-size: 14px;
            flex-grow: 1;
        }
        a:hover {
            text-decoration: underline;
        }
        .icon-btn {
            padding: 2px 6px;
            font-size: 12px;
        }
        .btn-group { display: flex; gap: 4px; }

        #editModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #fff;
            padding: 15px;
            border: 2px solid #000;
            width: 80%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-content h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>
    <svg class="heading-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        <line x1="9" y1="13" x2="15" y2="13"></line>
        <line x1="9" y1="17" x2="15" y2="17"></line>
    </svg>
    The Pi-peline
    </h2>
    <div class="input-group">
        <input type="text" id="listInput" placeholder="New list name..." autofocus>
        <button class="btn-add" onclick="addList()">+</button>
    </div>
    <ul id="listsContainer"></ul>

    <div id="editModal">
        <div class="modal-content">
            <h3>Rename List</h3>
            <input type="text" id="editInput">
            <div class="modal-actions">
                <button onclick="closeEditModal()">Cancel</button>
                <button class="btn-add" onclick="saveEdit()">Save</button>
            </div>
        </div>
    </div>

    <script>
        async function loadLists() {
            const res = await fetch('/api/lists', { cache: 'no-store' });
            const lists = await res.json();
            const container = document.getElementById('listsContainer');
            container.innerHTML = '';

            lists.forEach(lst => {
                const li = document.createElement('li');

                const a = document.createElement('a');
                a.href = `/list/${lst.id}`;
                a.textContent = lst.name;

                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-group';

                const editBtn = document.createElement('button');
                editBtn.innerHTML = '&#9998;';
                editBtn.className = 'icon-btn';
                editBtn.onclick = () => openEditModal(lst.id, lst.name);

                const delBtn = document.createElement('button');
                delBtn.innerHTML = '&#10005;';
                delBtn.className = 'icon-btn';
                delBtn.onclick = () => deleteList(lst.id);

                btnGroup.appendChild(editBtn);
                btnGroup.appendChild(delBtn);

                li.appendChild(a);
                li.appendChild(btnGroup);
                container.appendChild(li);
            });
        }

        async function addList() {
            const input = document.getElementById('listInput');
            const name = input.value.trim();
            if (!name) return;

            await fetch('/api/lists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            input.value = '';
            loadLists();
        }

        async function deleteList(id) {
            if (!confirm("Delete this list and all its items?")) return;
            await fetch(`/api/lists/${id}`, { method: 'DELETE' });
            loadLists();
        }

        let currentEditId = null;

        function openEditModal(id, currentName) {
            currentEditId = id;
            const modal = document.getElementById('editModal');
            const input = document.getElementById('editInput');
            input.value = currentName;
            modal.style.display = 'flex';
            input.focus();
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditId = null;
        }

        async function saveEdit() {
            const input = document.getElementById('editInput');
            const newName = input.value.trim();
            if (newName !== "" && currentEditId !== null) {
                await fetch(`/api/lists/${currentEditId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });
                loadLists();
            }
            closeEditModal();
        }

        document.getElementById('listInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addList();
        });
        document.getElementById('editInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit();
        });

        loadLists();
    </script>
</body>
</html>

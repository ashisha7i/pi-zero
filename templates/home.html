<!DOCTYPE html>
<html>
<head>
    <title>The Pi-peline</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>
    <h2>
    <svg class="heading-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        <line x1="9" y1="13" x2="15" y2="13"></line>
        <line x1="9" y1="17" x2="15" y2="17"></line>
    </svg>
    The Pi-peline
    </h2>
    <div class="input-group">
        <input type="text" id="listInput" placeholder="New list name..." autofocus>
        <button class="btn-add" onclick="addList()">+</button>
    </div>
    <ul id="listsContainer"></ul>

    <script>
        async function loadLists() {
            const res = await fetch('/api/lists', { cache: 'no-store' });
            const lists = await res.json();
            const container = document.getElementById('listsContainer');
            container.innerHTML = '';

            lists.forEach(lst => {
                const li = document.createElement('li');

                const a = document.createElement('a');
                a.href = `/list/${lst.id}`;
                a.textContent = lst.name;

                const delBtn = document.createElement('button');
                delBtn.innerHTML = '&#10005;';
                delBtn.className = 'icon-btn';
                delBtn.onclick = () => deleteList(lst.id);

                li.appendChild(a);
                li.appendChild(delBtn);
                container.appendChild(li);
            });
        }

        async function addList() {
            const input = document.getElementById('listInput');
            const name = input.value.trim();
            if (!name) return;

            await fetch('/api/lists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            input.value = '';
            loadLists();
        }

        async function deleteList(id) {
            if (!confirm("Delete this list and all its items?")) return;
            await fetch(`/api/lists/${id}`, { method: 'DELETE' });
            loadLists();
        }

        document.getElementById('listInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addList();
        });

        loadLists();
    </script>
</body>
</html>
